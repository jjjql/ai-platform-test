apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b

spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-8b

  template:
    metadata:
      labels:
        app: qwen3-8b

    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest

        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server

        args:
        - --model
        - /models/Qwen3-8B-AWQ
        - --served-model-name
        - qwen3-8b
        - --quantization
        - awq
        - --gpu-memory-utilization
        - "0.90"
        - --max-model-len
        - "8192"

        ports:
        - containerPort: 8000

        resources:
          limits:
            nvidia.com/gpu: 1

        volumeMounts:
        - name: models
          mountPath: /models

      volumes:
      - name: models
        hostPath:
          path: /data/models
          type: Directory
